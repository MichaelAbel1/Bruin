appId: com.bruin.agent
productName: Bruin
directories:
  output: desktop/release-current
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/build/renderer/**/*
  - package.json
extraResources:
  - from: .desktop-runtime
    to: runtime
  - from: .desktop-runtime/node_modules
    to: runtime/node_modules
    filter:
      - '**/*'
  - from: desktop/assets
    to: icons
    filter:
      - icon-*.png
npmRebuild: false
asar: true
mac:
  icon: desktop/assets/icon.svg
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
