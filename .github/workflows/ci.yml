name: Desktop validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run desktop:check
      - run: npm test
      - run: npm run desktop:dist -- --mac zip --publish never
        if: matrix.platform == 'macos'
      - run: npm run desktop:dist -- --linux AppImage --publish never
        if: matrix.platform == 'linux'
      - run: npm run desktop:dist -- --win nsis --publish never
        if: matrix.platform == 'windows'
      - run: unzip -tq desktop/release-current/Bruin-*-mac.zip
        if: matrix.platform == 'macos'
      - uses: actions/upload-artifact@v7
        with:
          name: bruin-${{ matrix.platform }}-unsigned
          path: desktop/release-current/*
          if-no-files-found: error
